<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Modern Dark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
        }
        #chat {
            height: 380px;
            overflow-y: auto;
            border: none !important;
            padding-right: 8px;
        }
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .msg-bubble {
            background: #334155;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.2s ease-in-out;
        }
        .msg-sender {
            font-weight: 600;
            color: #38bdf8;
            font-size: 0.85rem;
            margin-bottom: 2px;
        }
        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 10px;
        }
        .form-control:focus {
            background: #0f172a;
            color: #fff;
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .btn-custom {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none;
            border-radius: 10px;
            font-weight: 600;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
<div class="chat-card p-4">
    <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-2">
        <h4 class="m-0 fw-bold">⚡ Live Chat</h4>
        <span id="statusBadge" class="badge bg-warning text-dark">Connecting...</span>
    </div>

    <div id="chat" class="mb-3"></div>

    <div class="mb-2">
        <input id="senderInput" type="text" class="form-control" placeholder="Your display name..."/>
    </div>

    <div class="input-group">
        <input id="messageInput" type="text" class="form-control" placeholder="Type a message..."/>
        <button id="sendMessage" class="btn btn-primary btn-custom px-4" disabled>Send</button>
    </div>
</div>

<script>
    let stompClient = null;

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
        const badge = document.getElementById('statusBadge');
        badge.className = connected ? 'badge bg-success' : 'badge bg-danger';
        badge.textContent = connected ? 'Online' : 'Disconnected';
    }

    function connect() {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // Suppress console noise
        stompClient.connect({}, function (frame) {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            });
        }, function(err) {
            setConnected(false);
        });
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var msgDiv = document.createElement('div');
        msgDiv.className = 'msg-bubble';

        var senderDiv = document.createElement('div');
        senderDiv.className = 'msg-sender';
        senderDiv.textContent = message.sender || 'Anonymous';

        var contentDiv = document.createElement('div');
        contentDiv.textContent = message.content;

        msgDiv.appendChild(senderDiv);
        msgDiv.appendChild(contentDiv);
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        var sender = document.getElementById('senderInput').value.trim();
        var content = document.getElementById('messageInput').value.trim();
        if(!content) return;

        var chatMessage = { sender: sender || 'Anonymous', content: content };
        stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
        document.getElementById('messageInput').value = '';
    }

    document.getElementById('sendMessage').onclick = sendMessage;
    document.getElementById('messageInput').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    window.onload = connect;
</script>
</body>
</html>
